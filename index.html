<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاتصال بنجاح</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #1a1a2e;
            line-height: 1.6;
            padding: 50px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 139, 0.1);
            padding: 40px;
            text-align: center;
            border: 1px solid #e6f0ff;
        }
        h1 {
            color: #0056b3;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0, 86, 179, 0.1);
        }
        .subtitle {
            color: #4a5568;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        .welcome-message {
            background: linear-gradient(135deg, #e6f0ff 0%, #cde6ff 100%);
            border-left: 5px solid #0056b3;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .signature {
            color: #0056b3;
            font-weight: bold;
            font-size: 1.2rem;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>مرحباً بك في المهندس للخدمات الرقمية</h1>
        <p class="subtitle">نشكرك على زيارتك لموقعنا</p>
        <div class="welcome-message">
            <p>نتمنى لك يومًا موفقًا ومباركًا</p>
        </div>
        <p class="signature">فريق المهندس للخدمات الرقمية</p>
    </div>
</body>
</html>
